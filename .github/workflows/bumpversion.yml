name: Bump Release Version

on:
  workflow_call:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    name: "Bump version and create changelog with commitizen"
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.COMMITIZEN_RELEASE_SECRET }}
          fetch-depth: 0
      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: rapid-android_${{ github.run_id }}.apk
      - name: APK Rename
        run: |
          mv rapid-android_${{ github.run_id }}.apk rapid-android.apk
      - name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.COMMITIZEN_RELEASE_SECRET }}
          changelog_increment_filename: body.md
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.REVISION }}
          bodyFile: "body.md"
          skipIfReleaseExists: true
          artifacts: rapid-android.apk
      - name: Delete Artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: rapid-android_${{ github.run_id }}.apk
