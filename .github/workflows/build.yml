name: Build CI

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [Clang, GCC]
        qt: [6.8.3, 6.10.1]
        include:
          - compiler: GCC
            cxx: g++
            cc: gcc
          - compiler: Clang
            cxx: clang++
            cc: clang
    name: Desktop_${{ matrix.qt }}-${{ matrix.compiler }}

    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Install Qt
      uses: ./.github/actions/linux-install-qt
    - name: Install Dependencies
      uses: ./.github/actions/linux-install-dep
    - name: Setup default compiler
      run: |
        sudo update-alternatives --install /usr/bin/cc cc /usr/bin/${{ matrix.cc }} 100
        sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/${{ matrix.cxx }} 100
        echo "###############################################################"
        echo "Compiler CC"
        echo "$(cc --version)"
        echo "###############################################################"
        echo "###############################################################"
        echo "Compiler CXX"
        echo "$(c++ --version)"
        echo "###############################################################"
    - name: build and test
      run: |
        cmake --preset release
        cmake --build --preset release --target all --parallel
        ctest --preset release --output-on-failure
      env:
        QT_QPA_PLATFORM: offscreen
