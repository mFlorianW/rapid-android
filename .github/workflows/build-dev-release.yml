name: Development Release

on:
  push:
    branches: [ develop ]
  paths-ignore:
   - 'changelog.md'

permissions:
  contents: write

jobs:
  Build_Desktop:
    uses: ./.github/workflows/build-desktop.yml

  Build_Android:
    uses: ./.github/workflows/build-android.yml

  Development_Release:
    needs: [Build_Desktop, Build_Android]
    uses: ./.github/workflows/bumpdevversion.yml
