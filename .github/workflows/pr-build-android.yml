name: Pullrequest Build For Android

on:
  workflow_call:

jobs:
  Build_Android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [android_x86_64, android_arm64_v8a]
        qt: [6.8.3, 6.10.1]
        include:
          - abi: android_x86_64
            preset: android-x86
          - abi: android_arm64_v8a
            preset: android-arm64
    name: Android_${{ matrix.qt }}_${{ matrix.abi }}
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    - name: Install Android Setup
      uses: ./.github/actions/linux-install-qt-android

    - name: Build
      run: |
        for commit in $(git rev-list --reverse origin/${{ github.base_ref }}..origin/${{ github.head_ref }}); do

          echo "###############################################################"
          echo "# Start Build for Commit ${commit} for Android ${{ matrix.abi }}"
          echo "###############################################################"
          export QT_ANDROID_ROOT=/home/runner/work/rapid-android/Qt/${{ matrix.qt }}/${{ matrix.abi }}
          export QT_HOST_PATH=/home/runner/work/rapid-android/Qt/${{ matrix.qt }}/gcc_64
          export PATH=${ANDROID_SDK_ROOT}/cmake/3.31.1/bin:${ANDROID_ROOT_PATH}/ndk/26.3.11579264:${PATH}
          git checkout ${commit}
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --target apk --parallel
          echo "###############################################################"
          echo "# Finished Build Commit ${commit} for Android ${{ matrix.abi }}"
          echo "###############################################################"

        done
